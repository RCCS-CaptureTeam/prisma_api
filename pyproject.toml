[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma_api"
version = "0.4.5"
description = "A package for interacting with PrISMa Platform APIs. PrISMa is a holistic system for numerical synthesis and assessment of Metal-Organic Frameworks and their applications, for Direct Air Capture of CO2. For more information, see: https://prisma.hw.ac.uk."
authors = [
    {name = "RCCS-CaptureTeam", email = "team@prisma-platform.org"}
]
license = {text = "GNUv3"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "platformdirs>=2.5.0",
    "requests>=2.27.0",
]

[tool.setuptools]
packages = ["prisma_api"]
include-package-data = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[tool.ruff]
# Reference copies of prisma_cloud code, kept as the server has them.
extend-exclude = ["integration"]

[tool.ruff.lint.per-file-ignores]
# Notebook-style cells: bare expressions display values, and a failing call
# is reported and the demo moves on.
"examples/*" = ["B018", "BLE001"]
# Live dev-vs-prod report scripts: any failure is recorded and the run continues.
"tests/crosscheck_*.py" = ["BLE001", "S110", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

